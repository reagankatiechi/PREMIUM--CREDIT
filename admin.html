<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Supreme Credit administrator dashboard" />
  <title>Supreme Credit | Admin Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            supreme: {
              950: '#02352b',
              800: '#064d3b',
              700: '#0a6049',
              500: '#2e8c68',
              gold: '#ff9900',
              cream: '#f8f6ee'
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'ui-sans-serif', 'system-ui']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">
  <main id="loginView" class="grid min-h-screen place-items-center bg-supreme-950 p-5">
    <section class="w-full max-w-md rounded-2xl bg-white p-7 shadow-2xl sm:p-9">
      <div class="mb-8">
        <p class="font-['Outfit'] text-2xl font-extrabold tracking-tight text-supreme-800">Supreme<span class="text-supreme-gold">Credit</span></p>
        <p class="mt-2 text-sm text-slate-500">Administrator access</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <label class="block text-sm font-bold text-supreme-800">
          Admin access token
          <input id="accessToken" type="password" required autocomplete="current-password" placeholder="Enter secure access token" class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-3 outline-none transition focus:border-supreme-gold focus:ring-4 focus:ring-amber-100" />
        </label>
        <p id="loginError" class="hidden text-sm font-medium text-red-700" role="alert"></p>
        <button class="w-full rounded-lg bg-supreme-800 px-4 py-3 font-bold text-white transition hover:bg-supreme-gold focus:outline-none focus:ring-4 focus:ring-amber-200">Secure sign in</button>
      </form>
    </section>
  </main>

  <main id="dashboardView" class="hidden">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8">
        <div>
          <p class="font-['Outfit'] text-xl font-extrabold tracking-tight text-supreme-800">Supreme<span class="text-supreme-gold">Credit</span></p>
          <p class="text-xs font-medium text-slate-500">Loan applications & Registered Users</p>
        </div>
        <button id="logoutButton" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-bold text-supreme-800 hover:bg-slate-50">Sign out</button>
      </div>
    </header>
    <section class="mx-auto max-w-7xl px-5 py-8 sm:px-8">
      <div class="mb-7 flex flex-wrap items-end justify-between gap-3">
        <div>
          <p class="text-xs font-bold uppercase tracking-[.16em] text-supreme-gold">Overview</p>
          <h1 class="mt-1 font-['Outfit'] text-3xl font-bold text-supreme-950">Management Portal</h1>
        </div>
        <button id="refreshButton" class="rounded-lg bg-supreme-800 px-4 py-2.5 text-sm font-bold text-white hover:bg-supreme-700">Refresh data</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="mb-6 flex border-b border-slate-200 gap-4">
        <button id="tabApplications" class="pb-3 text-sm font-bold text-supreme-800 border-b-2 border-supreme-800">Loan Applications</button>
        <button id="tabUsers" class="pb-3 text-sm font-bold text-slate-500 hover:text-supreme-800">Registered Users & KYC Uploads</button>
      </div>

      <div id="statsRow" class="mb-7 grid gap-4 sm:grid-cols-3">
        <article class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Total applications</p>
          <p id="totalApplications" class="mt-2 font-['Outfit'] text-3xl font-bold text-supreme-800">—</p>
        </article>
        <article class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
          <p class="text-sm font-medium text-slate-500">KSh loaned / approved</p>
          <p id="totalApproved" class="mt-2 font-['Outfit'] text-3xl font-bold text-supreme-800">—</p>
        </article>
        <article class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Registered Accounts</p>
          <p id="totalUsersCount" class="mt-2 font-['Outfit'] text-3xl font-bold text-supreme-800">—</p>
        </article>
      </div>

      <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row">
          <input id="searchInput" type="search" placeholder="Search applicant name, national ID, or phone..." class="min-w-0 flex-1 rounded-lg border border-slate-200 px-4 py-2.5 outline-none focus:border-supreme-gold focus:ring-4 focus:ring-amber-100" />
          <select id="statusFilter" class="rounded-lg border border-slate-200 bg-white px-4 py-2.5 font-medium text-slate-700 outline-none focus:border-supreme-gold">
            <option value="All">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div id="tableMessage" class="hidden px-5 py-4 text-sm font-medium" role="status"></div>
        <div class="overflow-x-auto">
          <table class="min-w-[1100px] w-full text-left text-sm">
            <thead id="tableHead" class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"></thead>
            <tbody id="applicationsBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const API_BASE_URL = 'https://premium-credit.onrender.com';
    const storageKey = 'supreme_credit_admin_token';
    const money = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 });
    const date = new Intl.DateTimeFormat('en-KE', { dateStyle: 'medium', timeStyle: 'short' });
    
    let applications = [];
    let registeredUsers = [];
    let currentTab = 'applications';

    const byId = id => document.getElementById(id);
    const authHeaders = () => ({
      'Authorization': `Bearer ${localStorage.getItem(storageKey)}`,
      'x-admin-token': localStorage.getItem(storageKey),
      'Content-Type': 'application/json'
    });
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
    const statusClasses = { Pending: 'bg-amber-100 text-amber-800', Approved: 'bg-emerald-100 text-emerald-800', Rejected: 'bg-red-100 text-red-700' };

    function showMessage(message, isError = false) {
      const element = byId('tableMessage');
      element.textContent = message;
      element.classList.remove('hidden');
      element.className = `px-5 py-4 text-sm font-medium ${isError ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-800'}`;
    }

    function renderTableHead() {
      if (currentTab === 'applications') {
        byId('tableHead').innerHTML = `
          <tr>
            <th class="px-5 py-4">Photo</th>
            <th class="px-5 py-4">Applicant Details</th>
            <th class="px-5 py-4">National ID</th>
            <th class="px-5 py-4">Uploaded Documents</th>
            <th class="px-5 py-4">Requested Amount</th>
            <th class="px-5 py-4">Repayment</th>
            <th class="px-5 py-4">Status</th>
          </tr>`;
        byId('statusFilter').classList.remove('hidden');
      } else {
        byId('tableHead').innerHTML = `
          <tr>
            <th class="px-5 py-4">Profile Photo</th>
            <th class="px-5 py-4">Registered Name</th>
            <th class="px-5 py-4">Phone Number</th>
            <th class="px-5 py-4">National ID</th>
            <th class="px-5 py-4">ID Scans (Supabase Uploads)</th>
            <th class="px-5 py-4">Registration Date</th>
            <th class="px-5 py-4">Actions</th>
          </tr>`;
        byId('statusFilter').classList.add('hidden');
      }
    }

    function render() {
      renderTableHead();
      const query = byId('searchInput').value.trim().toLowerCase();

      if (currentTab === 'applications') {
        const status = byId('statusFilter').value;
        const filtered = applications.filter(item => {
          const itemStatus = item.status || 'Pending';
          const name = String(item.applicant_name || '').toLowerCase();
          const idNum = String(item.id_number || '').toLowerCase();
          const phone = String(item.phone_number || '').toLowerCase();
          return (status === 'All' || itemStatus === status) && (!query || name.includes(query) || idNum.includes(query) || phone.includes(query));
        });

        byId('applicationsBody').innerHTML = filtered.length ? filtered.map(item => {
          const appId = item.application_id || item.id;
          const name = item.applicant_name || 'N/A';
          const idNum = item.id_number || 'N/A';
          const phone = item.phone_number || 'N/A';
          const amount = item.loan_amount || 0;
          const period = item.repayment_period || '—';
          const itemStatus = item.status || 'Pending';
          const createdAt = item.created_at ? date.format(new Date(item.created_at)) : '—';
          
          const profilePic = item.profile_pic_url;
          const idFront = item.id_front_url;
          const idBack = item.id_back_url;

          return `<tr>
            <td class="px-5 py-4">
              ${profilePic 
                ? `<a href="${escapeHtml(profilePic)}" target="_blank"><img src="${escapeHtml(profilePic)}" class="h-10 w-10 rounded-full object-cover border border-slate-200" /></a>` 
                : `<div class="h-10 w-10 rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-500 font-bold">N/A</div>`}
            </td>
            <td class="px-5 py-4">
              <p class="font-bold text-supreme-950">${escapeHtml(name)}</p>
              <p class="text-xs text-slate-500">${escapeHtml(phone)}</p>
              <p class="text-[10px] text-slate-400">Date: ${createdAt}</p>
            </td>
            <td class="px-5 py-4 font-semibold text-slate-700">${escapeHtml(idNum)}</td>
            <td class="px-5 py-4 text-xs">
              <div class="flex flex-col gap-1">
                ${idFront ? `<a href="${escapeHtml(idFront)}" target="_blank" class="font-bold text-supreme-800 hover:text-supreme-gold underline">📄 ID Front Scan</a>` : `<span class="text-slate-400">ID Front: Missing</span>`}
                ${idBack ? `<a href="${escapeHtml(idBack)}" target="_blank" class="font-bold text-supreme-800 hover:text-supreme-gold underline">📄 ID Back Scan</a>` : `<span class="text-slate-400">ID Back: Missing</span>`}
              </div>
            </td>
            <td class="px-5 py-4 font-bold text-supreme-800">${money.format(amount)}</td>
            <td class="px-5 py-4">${escapeHtml(period)}</td>
            <td class="px-5 py-4">
              <select data-id="${appId}" class="rounded-full border-0 px-3 py-2 text-xs font-bold ${statusClasses[itemStatus] || statusClasses.Pending}">
                ${['Pending', 'Approved', 'Rejected'].map(st => `<option ${st === itemStatus ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
            </td>
          </tr>`;
        }).join('') : '<tr><td colspan="7" class="px-5 py-12 text-center text-slate-500">No loan applications found.</td></tr>';

        document.querySelectorAll('[data-id]').forEach(select => select.addEventListener('change', updateStatus));
      } else {
        const filtered = registeredUsers.filter(u => {
          const name = String(u.full_name || '').toLowerCase();
          const idNum = String(u.national_id || '').toLowerCase();
          const phone = String(u.phone || '').toLowerCase();
          return !query || name.includes(query) || idNum.includes(query) || phone.includes(query);
        });

        byId('applicationsBody').innerHTML = filtered.length ? filtered.map(u => {
          const createdAt = u.created_at ? date.format(new Date(u.created_at)) : '—';
          return `<tr>
            <td class="px-5 py-4">
              ${u.profile_pic_url 
                ? `<a href="${escapeHtml(u.profile_pic_url)}" target="_blank"><img src="${escapeHtml(u.profile_pic_url)}" class="h-10 w-10 rounded-full object-cover border border-slate-200" /></a>` 
                : `<div class="h-10 w-10 rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-500 font-bold">N/A</div>`}
            </td>
            <td class="px-5 py-4 font-bold text-supreme-950">${escapeHtml(u.full_name)}</td>
            <td class="px-5 py-4 font-medium text-slate-700">${escapeHtml(u.phone)}</td>
            <td class="px-5 py-4 font-semibold text-slate-700">${escapeHtml(u.national_id)}</td>
            <td class="px-5 py-4 text-xs">
              <div class="flex flex-col gap-1">
                ${u.id_front_url ? `<a href="${escapeHtml(u.id_front_url)}" target="_blank" class="font-bold text-supreme-800 hover:text-supreme-gold underline">📄 View ID Front</a>` : `<span class="text-slate-400">ID Front Missing</span>`}
                ${u.id_back_url ? `<a href="${escapeHtml(u.id_back_url)}" target="_blank" class="font-bold text-supreme-800 hover:text-supreme-gold underline">📄 View ID Back</a>` : `<span class="text-slate-400">ID Back Missing</span>`}
              </div>
            </td>
            <td class="px-5 py-4 text-xs text-slate-500">${createdAt}</td>
            <td class="px-5 py-4">
              <button onclick="resetUserPassword('${u.id}', '${escapeHtml(u.full_name)}')" class="rounded-lg bg-amber-500 px-3 py-1.5 text-xs font-bold text-white hover:bg-amber-600 transition">
                Reset Password
              </button>
            </td>
          </tr>`;
        }).join('') : '<tr><td colspan="7" class="px-5 py-12 text-center text-slate-500">No registered users found.</td></tr>';
      }
    }

    function renderStats() {
      const approved = applications.filter(item => item.status === 'Approved');
      byId('totalApplications').textContent = applications.length.toLocaleString('en-KE');
      byId('totalApproved').textContent = money.format(approved.reduce((total, item) => total + Number(item.loan_amount || 0), 0));
      byId('totalUsersCount').textContent = registeredUsers.length.toLocaleString('en-KE');
    }

    async function loadAllData() {
      showMessage('Syncing latest records…');
      try {
        const appRes = await fetch(`${API_BASE_URL}/api/admin/applications`, { headers: authHeaders() });
        if (appRes.status === 401) throw new Error('Unauthorized');
        if (appRes.ok) {
          const appBody = await appRes.json();
          applications = appBody.data || [];
        }

        const userRes = await fetch(`${API_BASE_URL}/api/admin/users`, { headers: authHeaders() });
        if (userRes.ok) {
          const userBody = await userRes.json();
          registeredUsers = userBody.data || [];
        }

        byId('tableMessage').classList.add('hidden');
        renderStats();
        render();
      } catch (error) {
        showMessage(error.message === 'Unauthorized' ? 'Your session is not authorized.' : 'Could not load data from backend.', true);
      }
    }

    async function resetUserPassword(userId, userName) {
      const newPassword = prompt(`Enter a new password for ${userName}:`);
      if (!newPassword) return;

      try {
        const response = await fetch(`${API_BASE_URL}/api/admin/users/${encodeURIComponent(userId)}/reset-password`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ newPassword })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Failed to update password');

        alert(`Password for ${userName} has been changed successfully!`);
      } catch (err) {
        alert(`Error: ${err.message}`);
      }
    }

    async function updateStatus(event) {
      const select = event.currentTarget;
      const appId = select.dataset.id;
      const previous = applications.find(item => String(item.application_id || item.id) === appId)?.status || 'Pending';
      select.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/admin/applications/${encodeURIComponent(appId)}`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ status: select.value })
        });
        if (!response.ok) throw new Error('Update failed');
        
        applications = applications.map(item => String(item.application_id || item.id) === String(appId) ? { ...item, status: select.value } : item);
        renderStats();
        render();
        showMessage('Status updated successfully.');
      } catch {
        select.value = previous;
        showMessage('Could not update status.', true);
        select.disabled = false;
      }
    }

    byId('tabApplications').addEventListener('click', () => {
      currentTab = 'applications';
      byId('tabApplications').className = 'pb-3 text-sm font-bold text-supreme-800 border-b-2 border-supreme-800';
      byId('tabUsers').className = 'pb-3 text-sm font-bold text-slate-500 hover:text-supreme-800';
      render();
    });

    byId('tabUsers').addEventListener('click', () => {
      currentTab = 'users';
      byId('tabUsers').className = 'pb-3 text-sm font-bold text-supreme-800 border-b-2 border-supreme-800';
      byId('tabApplications').className = 'pb-3 text-sm font-bold text-slate-500 hover:text-supreme-800';
      render();
    });

    byId('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      const token = byId('accessToken').value.trim();
      if (!token) return;
      localStorage.setItem(storageKey, token);
      byId('loginView').classList.add('hidden');
      byId('dashboardView').classList.remove('hidden');
      loadAllData();
    });

    byId('logoutButton').addEventListener('click', () => {
      localStorage.removeItem(storageKey);
      byId('dashboardView').classList.add('hidden');
      byId('loginView').classList.remove('hidden');
      byId('accessToken').value = '';
    });

    byId('refreshButton').addEventListener('click', loadAllData);
    byId('searchInput').addEventListener('input', render);
    byId('statusFilter').addEventListener('change', render);

    if (localStorage.getItem(storageKey)) {
      byId('loginView').classList.add('hidden');
      byId('dashboardView').classList.remove('hidden');
      loadAllData();
    }
  </script>
</body>
</html>
